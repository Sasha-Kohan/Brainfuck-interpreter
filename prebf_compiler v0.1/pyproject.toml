[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prebf-compiler"
version = "0.1.0"
description = "A modular compiler from a simple assembly-like language to Brainfuck"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
prebf = "prebf.cli:main"

[tool.setuptools]
packages = ["prebf"]
